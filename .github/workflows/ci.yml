name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test with coverage threshold
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Serve build
        run: |
          npm install --global serve
          serve -s dist -l 4173 &
          sleep 5

      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://127.0.0.1:4173
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 1
